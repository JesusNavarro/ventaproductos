async function cargaProductos(){
  productosEntrega=null;
  const costoTieneIva = document.getElementById("costoTieneIva");
  const entregaInput = document.getElementById("entregaInput");
  const cargaEntrega = document.getElementById("cargaEntrega");
  const divMensaje = document.getElementById("divMensaje");
  if (!entregaInput.value){
    alert("Elegir archivo a cargar");
    return;
  }
  const file = entregaInput.files[0];
  if (!file) {
      alert("No se ha seleccionado un archivo");
      return;
  }
  const texto = await file.text();
  const arrayBuffer = await file.arrayBuffer();
  const bytes = new Uint8Array(arrayBuffer);
  // convert to base64
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  const base64 = btoa(binary);
  let res = await myfetch("/entregas/cargar", 
    {"archivo_entrega": base64, "costoTieneIva": costoTieneIva.checked});
  if (!res.success){
    divMensaje.innerText = res.Error;
  }
  // let res = await myfetch("/producto/find",  {"searchString": "yeso", "buscaActivo": true});
  if (res.success) {
      let tp = document.getElementById("resProductos");
      if (tp){
        tp.remove();
      }
        let resProductos = res["resultado"];
        productosEntrega =   resProductos["productosEntrega"];
        let productosBuscados = resProductos["productosBuscados"];
        await generaTablaProductos(productosBuscados);
        entregaInput.value=null;
  }
}

function getName(prefix, name, suffix){
  let rname = prefix? prefix+toTitleCase(name):name;
  rname += toTitleCase(suffix);
  return rname;
}

function getControlByName(sectionKey, name, prefix, unidad){
  name = prefix? prefix+toTitleCase(name):name;
  name += toTitleCase(unidad);
  return getPTInput(sectionKey, name);
}

function changeMuestra(grupo){
  return {"change": function({obj, col, input, event, sectionKey}){
    //console.log(obj.seCompraPor);
    if (obj.seCompraPor!="paquete" || (obj.seCompraPor=="paquete" && grupo!="paquete")){
      let inputs = getPTInputsGroup(sectionKey, grupo);
        Array.from(inputs).forEach(el => {
            el.readOnly = !input.checked;
            input.checked? el.classList.remove("disabled") : el.classList.add("disabled");
        });
    }
  }};
}

function modGanancia(sectionKey, prefix, unidad){
  if (prefix!="llega"){
    let costo = getControlByName(sectionKey, "costo", prefix, unidad);
    let precio = getControlByName(sectionKey, "precio", prefix, unidad);
    let ganancia = getControlByName(sectionKey, "ganancia", prefix, unidad);
    let costoVal = parseSmartNumber(costo.value);
    let precioVal = parseSmartNumber(precio.value);
    let gananciaVal = parseSmartNumber(100*(precioVal-costoVal)/costoVal);
    ganancia.value = costoVal??0>0? String(gananciaVal)+"%" : "";
    if (ganancia.value && gananciaVal<=0 && !precio.classList.contains("disabled")){
      costo.closest("td").style.setProperty("background-color", "yellow", "important");
      precio.closest("td").style.setProperty("background-color", "orange", "important");
      ganancia.style.color="red";
    } else {
      precio.closest("td").style.setProperty("background-color", "transparent", "important");
      costo.closest("td").style.setProperty("background-color", "transparent", "important");
      ganancia.style.color="black";
    }
  }
}

function costoSinIvaChange(obj, sectionKey, prefix, unidad){
  let iva = getControlByName(sectionKey, "iva", prefix, unidad);
  let costoSinIva = getControlByName(sectionKey, "costoSinIva", prefix, unidad);
  let costo = getControlByName(sectionKey, "costo", prefix, unidad);
  iva.value = parseSmartNumber(parseSmartNumber(window.IVA/100) * parseSmartNumber(costoSinIva.value));
  costo.value = parseSmartNumber(parseSmartNumber(costoSinIva.value) + parseSmartNumber(iva.value));
  if (unidad=="paquete" && obj.seCompraPor=="paquete"){
    if (obj.numeroUnidades>0){
      let costoSinIvaUni = getControlByName(sectionKey, "costoSinIva", prefix, "unidad");
      costoSinIvaUni.value = parseSmartNumber(costoSinIva.value)/parseSmartNumber(obj.numeroUnidades);
      costoSinIvaChange(obj, sectionKey, prefix, "unidad");
      modGanancia(sectionKey, prefix, "unidad");
    }
    if (obj.numeroKgs>0){
      let costoSinIvaKg = getControlByName(sectionKey, "costoSinIva", prefix, "kg");
      costoSinIvaKg.value = parseSmartNumber(costoSinIva.value)/parseSmartNumber(obj.numeroKgs);
      costoSinIvaChange(obj, sectionKey, prefix, "kg");
      modGanancia(sectionKey, prefix, "kg");
    }
  }
}

function costoChange(obj, sectionKey, prefix, unidad){
  let iva = getControlByName(sectionKey, "iva", prefix, unidad);
  let costoSinIva = getControlByName(sectionKey, "costoSinIva", prefix, unidad);
  let costo = getControlByName(sectionKey, "costo", prefix, unidad);
  costoSinIva.value = parseSmartNumber(parseSmartNumber(costo.value)/parseSmartNumber(1+window.IVA/100));
  iva.value = parseSmartNumber(parseSmartNumber(costo.value)-parseSmartNumber(costoSinIva.value));
  if (unidad=="paquete" && obj.seCompraPor=="paquete"){
      if (obj.numeroUnidades>0){
        let costoUni = getControlByName(sectionKey, "costo", prefix, "unidad");
        costoUni.value = parseSmartNumber(costo.value)/parseSmartNumber(obj.numeroUnidades);
        costoChange(obj, sectionKey, prefix, "unidad");
        modGanancia(sectionKey, prefix, "unidad");
      }
      if (obj.numeroKgs>0){
        let costoKg = getControlByName(sectionKey, "costo", prefix, "kg");
        costoKg.value = parseSmartNumber(costo.value)/parseSmartNumber(obj.numeroKgs);
        costoChange(obj, sectionKey, prefix, "kg");
        modGanancia(sectionKey, prefix, "kg");
      }
  }
}
