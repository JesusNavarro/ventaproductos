<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<style>
    html, body {
        touch-action: manipulation;
        background-color: #F7F7F7;
    }
    body {
        /*display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0; 
        font-family: Arial, sans-serif; 
        background: #000000;
        color: white; */
    }
    /* Remove up and down changers in numeric inputs */
    /* Chrome, Safari, Edge, Opera */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    /* Firefox */
    input[type=number] {
        -moz-appearance: textfield;
    }
    /* Placeholder styling (always applies when empty) */
    input::placeholder {
        color: magenta;
        opacity: 0.7;
    }

    /* Required + empty + invalid → placeholder color */
    input:required:placeholder-shown:invalid::placeholder {
        color:red;
        opacity: 0.7;
    }

    /* Legacy fallbacks */
    /* WebKit */
    input:required:placeholder-shown:invalid::-webkit-input-placeholder {
        color: red;
        opacity: 0.7;
    }
    /* IE / Edge legacy */
    input:required:placeholder-shown:invalid:-ms-input-placeholder {
        color: red;
        opacity: 0.7;
    }
    /* Firefox */
    input:required:placeholder-shown:invalid::-moz-placeholder {
        color: red;
        opacity: 0.7;
    }

    /* Empty input (placeholder visible, NOT invalid yet) */
    input:placeholder-shown {
        background-color: mintcream;
        border: 2px solid gray;
        color: inherit;
    }

    /* Empty AND required (invalid + placeholder shown) */
    input:required:placeholder-shown:invalid {
        border: 3px solid red;
        background-color: lightgray;
        /* color: #71eda4; */
    }

    /* Not empty but invalid */
    input:not(:placeholder-shown):invalid {
        border: 3px solid red;
        background-color: lightgray;
        /* color: #ccc; */
    }

    #scanner, #scanner-mac, video {
        width: 400px;
        height: 200px;
        margin-bottom: 10px;
        border: 2px solid #007bff;
        transform: scaleX(-1);
        background-color: transparent;
        object-fit: cover;     /* fill the box, crop edges if needed */
    }
    #estado { margin-bottom: 5px; font-weight: bold; display: none;}
    #mensaje { margin-bottom: 10px; color: red; font-weight: bold;}
    #btn-escanear { display: none; margin-bottom: 10px; }
    /* #btn-guardar { float: right; margin-bottom: 10px; display: none;} */
    #toggle-camera {
        background-color: rgba(255, 255, 255, 0.8);
        color: #000;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 4px 10px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background-color: #F7F7F7;
    }
    #tabla-productos {
        /* height: 100%; */
        overflow-y: auto;
        overflow-x: hidden;
        background-color: #F7F7F7;
    }
    table th, table td {
        border: 0;
        padding: 4px 6px;
        text-align: left;
    }
    /* When JS toggles 'hidden' on these elements they will disappear */
    .celda_ocultable.hidden {
        display: none !important;
    }
    .celda_ocultable {
        display: none;
    }
    /* small spacing for action icons */
    .action-icon { cursor: pointer; margin-left:6px; margin-right:6px; vertical-align:middle; }
    .info-btn {
        background-color: transparent !important;
    }
    .info-btn.activeInfo {
        background-color: lightgreen !important;
    }
    tr.ultimo
    {
        background-color: lightblue !important;
    }
    /* div.divAgregarTipoVenta,
    div.divAgregarTipoVenta * {

    </style>
