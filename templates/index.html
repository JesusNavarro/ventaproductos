<HTML>
<head>
<title>VentaProductos</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<style>
    /* Center container */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;   /* 👈 this is the key */
        align-items: center;
        justify-content: center;
        background: black;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Big call-to-action button */
    .open-app-btn {
        padding: 28px 60px;
        font-size: 26px;
        font-weight: 600;
        border-radius: 16px;
        border: none;
        cursor: pointer;

        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;

        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .open-app-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.22);
    }

    .open-app-btn:active {
        transform: translateY(1px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
    }
            /* App window overlay */
    .app-window {
        position: fixed;
        inset: 0;
        background: #111;
        display: none;
        flex-direction: column;
        z-index: 9999;
    }

    /* Header bar */
    .app-header {
        height: 48px;
        background: #1f2937;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        font-weight: 600;
    }

    /* Window buttons */
    .window-controls {
        display: flex;
        gap: 8px;
    }

    .window-btn {
        width: 34px;
        height: 28px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }

    .min-btn {
        background: #facc15;
    }

    .close-btn {
        background: #ef4444;
        color: white;
    }

    /* Workspace iframe */
    .app-content {
        flex: 1;
        border: none;
        width: 100%;
    }
</style>
</head>
<body>
<div id="mensajeRegistro"></div>
<div id="inicioDiv"></div>
<script>
const configDev = {{ configDev | tojson }};
const thisIP = {{ thisIP | tojson}};
if (thisIP && configDev && configDev["MS_SOY"] && configDev["MS_SOY"]["direccionIP"] && thisIP!=configDev["MS_SOY"]["direccionIP"]){
    let mensajeRegistro = document.getElementById("mensajeRegistro");
    mensajeRegistro.style.color = "white";
    mensajeRegistro.innerHTML = '<b>Ventas, inventario, etc. funciona bien, solo no se puede pasar ventas de un dispositivo a otro</b>';
    mensajeRegistro.innerHTML += `<br/>La direccion IP de este dispositivo cambio a ${thisIP}`;
    mensajeRegistro.innerHTML += '<br/>Ir a la seccion de AJUSTES y actualizar en ambos dispositivos para que puedan comunicarse';
    mensajeRegistro.innerHTML += '<br/>Y reiniciar la aplicacion en cada uno de ellos<br/><br/>';
}

let rol;
if (configDev){
    if (configDev["MS_SOY"]){
        rol = configDev["MS_SOY"]["rol"];
    }
}

function openAppWindow() {
    const width = screen.availWidth;
    const height = screen.availHeight;

    const features = `
        width=${width},
        height=${height},
        left=0,
        top=0,
        resizable=yes,
        scrollbars=yes,
        toolbar=no,
        location=no,
        menubar=no,
        status=no
    `.replace(/\s+/g, '');

    const win = window.open("/workspace", "appWindow", features);

    if (!win) {
        alert("El navegador bloqueó la ventana emergente.");
        return;
    }

    win.focus();
}

let inicioDiv = document.getElementById("inicioDiv");
let btn = document.createElement("button");
btn.textContent = "Abrir aplicacion";
btn.className = "open-app-btn";
inicioDiv.appendChild(btn);

if (rol && rol=="maestro") {
    //window.location.replace("/workspace");
    btn.addEventListener("click", openAppWindow);
}
if (!rol || (rol && rol=="esclavo")){
    btn.addEventListener("click", function(){
        window.open("/workspace", "_blank"); // same tab
    });
    
}
</script>

</body>
</HTML>
