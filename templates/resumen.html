function activarCambiarFecha(){

    const btnCambiaFechaVenta = document.getElementById("btnCambiaFechaVenta");

    btnCambiaFechaVenta.addEventListener("click", async function() {
        const detalles = document.getElementById("ventas-container");
        const nuevaFechaVenta = document.getElementById("nuevaFechaVenta");
        if (!nuevaFechaVenta.value){
            alert("Seleccionar una nueva fecha de venta");
            return;
        }
        let ventasActivar = [];
        const prodCambiados = Array.from(
            detalles.querySelectorAll('input.row-cancel:checked')
        ).map(cb => cb.closest('tr'));
        prodCambiados.forEach(tr => {
            //console.log(tr.dataset);
            ventasActivar.push(tr.dataset);
        });
        if (ventasActivar.length>0){
            //console.log(ventasActivar);
            if (!confirm(`¿Cambiar fecha de venta de ${ventasActivar.length} productos a ${nuevaFechaVenta.value}?`)) return;
            res = await myfetch("/ventas/cambiarFecha", {"ventas":ventasActivar, "nuevaFecha": nuevaFechaVenta.value});
            if (res.success){
                await actualizaPagina(
                    currentDate.year,
                    currentDate.month,
                    currentDate.day
                );
                nuevaFechaVenta.value=null;
            } else {
                centerMessage("Algunos productos no modificados");
            }
        } else {
            alert("No hay productos seleccionados para cambiar su fecha de venta");
        }
    });

}

function applyHeatMap() {
    const cells = document.querySelectorAll('td.monto');
    const values = [];
    cells.forEach(el => {
        val = parseFloat(el.textContent);
        //console.log(val);
        if (!isNaN(val)) values.push(val);
    });
    if (!values.length) return;
    const min = Math.min(...values);
    const max = Math.max(...values);
    cells.forEach(el => {
        const value = parseFloat(el.textContent);
        if (isNaN(value)) return;
        const intensity = (value - min) / (max - min || 1);
        const color = heatColor(intensity);
        el.style.backgroundColor = color;
    });
}

function getMesSelected(){
    let selectedMonth = document.querySelector('input[name="mes"]:checked').value;

function diaSelect(diaTd) {
    let mesSelected = diaTd.id.split('_').slice(2, 3).join('');
    let diaSelected = diaTd.id.substring(diaTd.id.lastIndexOf('_') + 1);
    if (!isValidDate(anios.value, mesSelected, diaSelected)){
        alert("Fecha no valida: "+diaSelected+" "+meses[mesSelected]+" "+anios.value);
        return;
    }
    const cells = document.querySelectorAll('td.monto');
    cells.forEach(el => {
        el.classList.remove("active");
    });
    diaTd.classList.add("active");
    document.querySelector(`input[name="mes"][value="${mesSelected}"]`).checked=true;
    mesChanged();
    //console.log(anios.value + " "+ mesSelected + " "+ diaSelected);
    displayDetallesDia(anios.value, mesSelected, diaSelected);
}

            }
            return true;
        });

            const clave = `${row["dispositivoId"]}-${row["fechaVenta"]}`;

            ventasMap[clave].push(row);
        });

            .map(([clave, productos]) => {
            const fechaObj = new Date(productos[0].fechaVenta);
            const totalVenta = productos.reduce((sum, p) => sum + ((isNaN(p.subtotal) || p.cancelada)? 0 : p.subtotal), 0);
            return { clave, productos, totalVenta, fechaObj };
            })
            .sort((a, b) => b.fechaObj - a.fechaObj );

        const totalDia = ventas.reduce((sum, v) => sum + v.totalVenta, 0);
        const fechaDelDia = `${vdia}/${vmes}/${vanio}`;

                <td class="${isNaN(p.precio) ? 'nan' : ''}">$${isNaN(p.precio)? p.precio : p.precio.toFixed(2)}</td>

/* White → Dark Red */
// function heatColor(t) {
//     const r = Math.round(255 * (1 - t));
//     const g = 255;
//     const b = Math.round(255 * (1 - t));
// }

function heatColor(t) {
    // Clamp t between 0 and 1  for rgb(0, 206, 255)
    t = Math.max(0, Math.min(1, t));
    const r = Math.round(255 + t * (0   - 255));
    const g = Math.round(255 + t * (206 - 255));
    const b = Math.round(255 + t * (255 - 255));

    return `rgb(${r}, ${g}, ${b})`;
}

async function getYearSales(){
    //console.log(anios.value);
    res = await myfetch("/ventas/resumen", Number(anios.value));
    //console.log(res);
    if (res.success){
        //console.log(res);
        resumen.innerHTML='';
        for (let i=1; i<=12; i++){
            let tr = document.createElement("tr");
            tr.id="tr_mes_"+i;
            total_mes =0;
            let td = document.createElement("td");
            td.textContent = meses[i];
            td.style.paddingRight = "30px";
            tr.append(td);
            for (let j=1; j<=31; j++){
                td = document.createElement("td");
                if (isValidDate(anios.value, i, j)){
                    mesDict = res["resultado"][i];
                    //console.log("mes "+JSON.stringify(mesDict));
                    td.id = "td_mes_"+i+"_dia_"+j;
                    //console.log(mes);
                    if (mesDict){
                        dia = mesDict[j];
                        //console.log("dia "+JSON.stringify(dia));
                        if (Object.hasOwn(mesDict,j)){
                            td.classList.add("monto");
                            td.textContent = (dia/1000).toFixed(1);
                            td.title = dia;
                            total_mes+=dia;
                            td.style.cursor= "crosshair";
                            td.addEventListener("click", function(){
                                diaSelect(this);
                            });
                        } else {
                            td.style.backgroundColor = "lightgray";
                        }
                    } else {
                        td.style.backgroundColor = "lightgray";
                    }
                } else {
                    td.style.backgroundColor = "gray";
                }
                tr.append(td);
            }
            td = document.createElement("td");
            td.textContent = (total_mes/1000).toFixed(1);
            td.title = total_mes;
            td.style.fontWeight = 'bold';
            tr.append(td);
            resumen.append(tr);
        }
    }
}

        let sp = document.createElement("span");
        sp.innerText=meses[i];
        rad.setAttribute("type", "radio");
        rad.setAttribute("name", "mes");
        rad.value = i;
        rad.style.display= "none";
        lbl.classList.add("radioLabel");
        lbl.append(rad);
        lbl.append(sp);
        td.append(lbl);
        menuMeses.append(td);
    }
    let mes = document.getElementsByName("mes");
    mes.forEach(radio => {
        radio.addEventListener("change", function () {
            mesChanged();
        });
    });
}

function incluyeDiaSemana(selectedMonth) {
    const table = document.getElementById("resumenTable");
    const thead = table.tHead;

    // Prevent duplicates (optional)
    const row = thead.querySelector(".extra-header");
    if (row) row.remove();

    if (selectedMonth>0 && selectedMonth<13){
        const tr = thead.insertRow(0);
        tr.classList.add("extra-header");
        tr.setAttribute("background-color", "blue")
        for (let i = 0; i <=32; i++) {
            const th = document.createElement("th");
            th.textContent = getWeekdaySpanish(anios.value, selectedMonth, i).substring(0,2);
            tr.appendChild(th);
        }
    }
}

function mesChanged(){
    let selectedMonth = document.querySelector('input[name="mes"]:checked').value;
    for (const tr of resumen.rows){
        tr.style.display = selectedMonth==13 ? '' : tr.id=="tr_mes_"+selectedMonth ? '' : 'none';
    }
    incluyeDiaSemana(selectedMonth);
}

async function selectDate(year, month, day){
    //console.log(year, month, day);
    if (anios.value != year){
        anios.value = year;
        await getYearSales();
        applyHeatMap();
        //console.log("Se cambio el anio");
    }
    document.querySelector(`input[name="mes"][value="${month}"]`).checked=true;
    mesChanged();
    tdId="#td_mes_"+month+"_dia_"+day;
    //console.log(tdId)
    let tdDay = document.querySelector(tdId);
    if (tdDay.innerText!=''){
        tdDay.click();
    }
    //alert(tdId);
}

function activateCancelLogic(){
    const btnCancel = document.getElementById("btn-cancel-mode");
    const detalles = document.getElementById("ventas-container");

    btnCancel.onclick = async function() {
        let ventasActivar = [];
        const prodCambiados = Array.from(
            detalles.querySelectorAll('input.row-cancel:checked')
        ).map(cb => cb.closest('tr'));
        prodCambiados.forEach(tr => {
            //console.log(tr.dataset);
            ventasActivar.push(tr.dataset);
        });
        if (ventasActivar.length>0){
            //console.log(ventasActivar);
            if (!confirm(`¿Activar o cancelar venta de ${ventasActivar.length} productos?`)) return;
            res = await myfetch("/ventas/activar", ventasActivar);
            if (res.success){
                await actualizaPagina(
                    currentDate.year,
                    currentDate.month,
                    currentDate.day
                );
            } else {
                centerMessage("Algunos productos no modificados");
            }
        } else {
            alert("No hay cambios para cancelar o reactivar ventas");
        }
    };

    detalles.querySelectorAll(".venta-checkbox").forEach(cb => {
        cb.addEventListener("change", e => {
            const ventaHeaderRow = cb.closest('tr');
            //console.log(ventaHeaderRow.dataset.ventaId);
            //console.log(`.venta-row[data-venta-id="${ventaHeaderRow.dataset.ventaId}"]`);
            const ventaCheckboxes = detalles.querySelectorAll(`.venta-row[data-venta-id="${ventaHeaderRow.dataset.ventaId}"] input[type="checkbox"].row-cancel`); //
            ventaCheckboxes.forEach( b => {
                b.checked = cb.checked;
                b.dispatchEvent(new Event("change", { bubbles: true }));
            });
        });
    });

    detalles.querySelectorAll(".row-cancel").forEach(cb => {
        cb.addEventListener("change", e => {
            const row = cb.closest(".venta-row");
            const iniCancel = Number(row.dataset.cancelInitial) === 1;
            row.dataset.cancelada = Number(cb.checked ? !iniCancel : iniCancel);
            if (row.dataset.cancelada!=iniCancel){
                row.style.fontWeight="bold";
                row.style.textDecoration="underline";
            } else {
                row.style.fontWeight="";
                row.style.textDecoration="";
            }
        });
    });

    document.querySelectorAll(".venta-row").forEach(row => {
        if (Number(row.dataset.cancelInitial) === 1) {
            row.classList.add("cancelled");
        }
    });
}

async function cargaVentasSemana(year, month, day){
    res = await myfetch("/ventas/semana", {"anio": Number(year), "mes": Number(month), "dia":Number(day)});
    //console.log(res);
    if (res.success){
        ventasSemana.innerHTML='';
        //console.log(res.resultado);
        for (const v of res.resultado.toReversed()){
            //console.log(v);
            let td = document.createElement("td");
            td.classList.add("venta_semana");
            td.innerHTML = getWeekdaySpanish(v.anio, v.mes, v.dia) +"<br/>"+ v.fecha + "<br/><b>$ " + v.subtotal+"</b>";
            td.addEventListener("click", async function(){
                //console.log(v.anio, v.mes, v.dia);
                await displayDetallesDia(String(v.anio), String(v.mes), String(v.dia));
                const cells = document.querySelectorAll('td.venta_semana');
                cells.forEach(el => {
                    el.classList.remove("active");
                });
                td.classList.add("active");
            });
            ventasSemana.append(td);
        }
        if (res.resultado.length>0){
            r = res.resultado[0];
            await displayDetallesDia(String(r.anio), String(r.mes), String(r.dia));
        }
    }
}

async function actualizaPagina(year, month, day){

    // update global state
    currentDate.year = year;
    currentDate.month = month;
    currentDate.day = day;
    //console.log(configDev);
    if (window.thisRol == "maestro"){
    //if (rol == "esclavo"){
        //console.log(rol);
        displayMenuMeses();
        await getYearSales();
        applyHeatMap();
        await selectDate(year, month, day);
        const elementos= document.querySelectorAll(`.ventas_anio`);
        elementos.forEach( ele =>{
            ele.classList.add("active");
        });
    } else if (window.thisRol == "esclavo"){
    //} else if (rol == "maestro"){
        //console.log("Soy escalvo");
        let elementos= document.querySelectorAll(`.ventas_semana`);
        elementos.forEach( ele =>{
            ele.classList.add("active");
        });
        await cargaVentasSemana(year, month, day);
        cambiaFechaVenta.style.display='none';
    }
}
