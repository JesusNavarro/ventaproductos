<script type="module">
import { startJob, watchJob } from "/static/js/jobs.js";

const truperInput = document.getElementById("truperInput");
const inventarioInput = document.getElementById("inventarioInput");
const procesaBarras = document.getElementById("procesaBarras");
const procesaImagenes = document.getElementById("procesaImagenes");
//const manualPicker = document.getElementById("manualPicker");
//manualPicker.onclick = () => fileInput.click();

// truperInput.addEventListener("change", async (e) => {
//     console.log(truperInput.value);
// });

document.getElementById("runTruperBtn").addEventListener("click", async () => {
    const file = truperInput.files[0];
    if (!file || !truperInput.value) {
        alert("No se ha seleccionado un archivo");
        return;
    }
    // Read file text
    const texto = await file.text();
    console.log("Barras: "+Number(procesaBarras.checked));
    console.log("Imagenes: "+Number(procesaImagenes.checked));
    const jobId = await startJob(
        "procesaTruper",
        { "archivos_texto" :  {"truperNuevo": texto},
            "procesaBarras": Number(procesaBarras.checked),
            "procesaImagenes": Number(procesaImagenes.checked)
        }
    );
    console.log(jobId);
    watchJob(
        jobId,
        p => console.log("Progress:", p),
        j => {console.log("Final rows:", j.result);
            console.log("Exit code:", j.exitCode);
            console.log("Job:", j);
            }
    );
});


document.getElementById("runInventarioBtn").addEventListener("click", async () => {
    const file = inventarioInput.files[0];
    if (!file || !inventarioInput.value) {
        alert("No se ha seleccionado un archivo");
        return;
    }
    // Read file text
    const texto = await file.text();
    // console.log("Barras: "+Number(procesaBarras.checked));
    // console.log("Imagenes: "+Number(procesaImagenes.checked));
    const arrayBuffer = await file.arrayBuffer();
    const bytes = new Uint8Array(arrayBuffer);
    // convert to base64
    let binary = "";
    bytes.forEach(b => binary += String.fromCharCode(b));
    const base64 = btoa(binary);

    const jobId = await startJob(
        "procesaInventario",
        { "archivos_texto" :  {"inventarioNuevo": base64}
            // "procesaBarras": Number(procesaBarras.checked),
            // "procesaImagenes": Number(procesaImagenes.checked)
        }
    );
    console.log(jobId);
    watchJob(
        jobId,
        p => console.log("Progress:", p),
        j => {console.log("Final rows:", j.result);
            console.log("Exit code:", j.exitCode);
            console.log("Job:", j);
            }
    );
});


</script>
